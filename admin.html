<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Registration Admin | Sama-Sama Tayo</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main>
      <section class="login-card" id="login-view">
        <img src="public/assets/sama-sama-logo.jpg" alt="Sama-Sama Tayo" />
        <p class="eyebrow">Committee access</p>
        <h1>Registration records</h1>
        <p>Enter the administration password to view attendee information and payment receipts.</p>
        <form id="login-form">
          <label for="password">Admin password</label>
          <input id="password" type="password" autocomplete="current-password" required autofocus />
          <button type="submit">Sign in</button>
          <p class="error" id="login-error" role="alert"></p>
        </form>
      </section>

      <section class="dashboard" id="dashboard" hidden>
        <header>
          <div><p class="eyebrow">Sama-Sama Tayo</p><h1>Registrations</h1><p id="summary">Loading records…</p></div>
          <div class="header-actions"><button id="refresh" type="button">Refresh</button><button id="logout" type="button">Sign out</button></div>
        </header>
        <div class="filters"><label><span>Search</span><input id="search" type="search" placeholder="Name, reference, batch…" /></label><label><span>Status</span><select id="status-filter"><option value="">All statuses</option><option>For Payment Verification</option><option>Confirmed</option></select></label></div>
        <div class="table-wrap"><table><thead><tr><th>Reference</th><th>Alumni</th><th>Attendance</th><th>Payment</th><th>Status</th><th>Submitted</th><th>Receipt</th><th>Verify</th></tr></thead><tbody id="registrations"></tbody></table></div>
        <div class="empty" id="empty" hidden>No matching registrations found.</div>
      </section>
    </main>
    <script src="api-config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
